# nb-prod1-app-bo (2 instances)
# One rule covers all instances in the group automatically — Mimir evaluates
# per-instance based on the job/instance labels present in the metric.
#
# TO VERIFY BEFORE DEPLOYING:
#   - real metric names (cpu_usage / memory_usage are placeholders)
#   - runbook_url / dashboard_url values (placeholders below)
#   - team label matches your actual team naming

groups:
  - name: nb-prod1-bo-alerts
    rules:
      - alert: BOHighCPU
        expr: cpu_usage{job="nb-prod1-app-bo"} > 90
        for: 5m
        labels:
          project: devops-nb-sandbox-180925
          env: prod1
          instance_group: nb-prod1-app-bo
          team: backoffice
          severity: P1
        annotations:
          summary: "CPU above 90% on {{ $labels.instance }}"
          description: "{{ $labels.instance }} (nb-prod1-app-bo) CPU is {{ $value }}%"
          runbook_url: "https://REPLACE_ME/runbooks/bo-high-cpu"
          dashboard_url: "https://REPLACE_ME/grafana/d/REPLACE/bo-overview"

      - alert: BOHighMemory
        expr: memory_usage{job="nb-prod1-app-bo"} > 80
        for: 5m
        labels:
          project: devops-nb-sandbox-180925
          env: prod1
          instance_group: nb-prod1-app-bo
          team: backoffice
          severity: P1
        annotations:
          summary: "Memory above 80% on {{ $labels.instance }}"
          description: "{{ $labels.instance }} (nb-prod1-app-bo) memory is {{ $value }}%"
          runbook_url: "https://REPLACE_ME/runbooks/bo-high-memory"
          dashboard_url: "https://REPLACE_ME/grafana/d/REPLACE/bo-overview"
